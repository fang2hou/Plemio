name: Fonts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }} ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [plemio, nerd]
        region: [SC, TC, JP, KR]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Install dependencies (uv)
        run: mise run sync
      - name: Fetch pinned sources
        run: mise run fetch
      - name: Build regional fonts
        env:
          VARIANT: ${{ matrix.variant }}
          REGION: ${{ matrix.region }}
        run: mise run build -- -v "$VARIANT" -r "$REGION" --jobs 4
      - name: Verify built fonts
        run: mise run verify-fonts
      - name: Upload built TTFs
        uses: actions/upload-artifact@v7
        with:
          name: ttf-${{ matrix.variant }}-${{ matrix.region }}
          path: build/fonts/*.ttf
          if-no-files-found: error
          retention-days: 1

  bundle:
    name: Bundle ${{ matrix.variant }} ${{ matrix.batch.name }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [plemio, nerd]
        batch:
          - name: upright-light
            styles: "Thin ExtraLight Light Regular"
          - name: upright-heavy
            styles: "Text Medium SemiBold Bold"
          - name: italic-light
            styles: "ThinItalic ExtraLightItalic LightItalic Italic"
          - name: italic-heavy
            styles: "TextItalic MediumItalic SemiBoldItalic BoldItalic"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Install dependencies (uv)
        run: mise run sync
      - name: Download variant TTFs
        uses: actions/download-artifact@v8
        with:
          pattern: ttf-${{ matrix.variant }}-*
          path: build/fonts
          merge-multiple: true
      - name: Bundle TTC batch
        env:
          VARIANT: ${{ matrix.variant }}
          STYLES: ${{ matrix.batch.styles }}
        run: |
          args=(-v "$VARIANT")
          for style in $STYLES; do
            args+=(-s "$style")
          done
          mise run bundle -- "${args[@]}"
      - name: Upload bundled TTCs
        uses: actions/upload-artifact@v7
        with:
          name: ttc-${{ matrix.variant }}-${{ matrix.batch.name }}
          path: build/ttc/*.ttc
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package font archives
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Install dependencies (uv)
        run: mise run sync
      - name: Fetch source licenses
        run: mise run fetch
      - name: Download built TTFs
        uses: actions/download-artifact@v8
        with:
          pattern: ttf-*
          path: build/fonts
          merge-multiple: true
      - name: Download bundled TTCs
        uses: actions/download-artifact@v8
        with:
          pattern: ttc-*
          path: build/ttc
          merge-multiple: true
      - name: Package release archives
        run: mise run package
      - name: Upload font archives
        uses: actions/upload-artifact@v7
        with:
          name: plemio-archives
          path: build/dist/*.zip
          if-no-files-found: error
