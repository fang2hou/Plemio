name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install toolchain (mise)
        uses: jdx/mise-action@v5
      - name: Install dependencies (uv)
        run: mise run sync
      - name: Cache pinned sources
        uses: actions/cache@v6
        with:
          path: sources
          key: sources-${{ hashFiles('sources.lock') }}
      - name: Fetch pinned sources
        run: mise run fetch
      - name: Run checks
        run: mise run check
      - name: Run tests
        run: uv run pytest
      - name: Build SC Regular variants
        run: mise run build -- -r SC -s Regular --jobs 2
      - name: Verify built fonts
        run: mise run verify-fonts
