[project]
name = "plemio"
version = "0.1.0"
description = "Build pipeline for Plemio, a 2:1 monospaced CJK programming font based on IBM Plex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.60",
    "pillow>=11",
    "pydantic>=2.11",
    "skia-pathops>=0.9",
    "ttfautohint-py>=0.5",
    "typer>=0.19",
]

[project.scripts]
plemio = "plemio.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "PL", "RUF", "PERF", "FURB", "PIE", "S", "PT", "ARG", "ERA", "T20",
]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001"]
"src/plemio/{preview,specimen}.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
